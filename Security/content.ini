​Let's talk about ethical hacking. ​Ethical hacking is also known as penetration testing, ​and it means a security professional with permission uses ​the same techniques as ​a malicious hacker to ​discover and exploit vulnerabilities. ​Vulnerability scanning, we know there ​can be a lot of false positives, ​but it's a very comprehensive report. ​With ethical hacking, we don't get any false positives. ​If I was able to exploit a vulnerability and get in, ​that's not a false positive, ​but it's typically not as comprehensive. ​There's usually a specific scope ​for the penetration tests. ​Stages of hacking, ​these are the stages that hackers go through, ​and ethical hackers go through. 
​The first stage is passive reconnaissance, ​then we move into active reconnaissance. ​We'll get our initial exploitation. ​Then we do privilege escalation, establish persistence, ​we clear tracks and then if you're an ethical hacker, ​typically there's a report. ​We're actually going to see individual slides on these. ​It's not just going to be this list ​of bullets, so don't panic. ​Passive always means without contacting the target. ​Reconnaissance means to get information. 
​Passive reconnaissance means to get ​information without contacting the target. ​How would we do that? ​We could research the target ​using open source information. ​I can go out to Google and see ​what Google knows about the target. ​I can go to any open source of ​information on the Internet to see what I can get. ​Open sources of intelligence might be referred to ​as OSINT or open source intelligence. ​Passive, of course, means without contacting the target. 
​There's actually, you can see a site OSINT ​Framework that would guide you through what those are. ​DNS database, Whois records, ​there's all places where you can get information about ​your target that doesn't involve contacting them anyway. ​You never know what's going to be ​useful when you're doing a penetration test. ​If you haven't seen the 1984 movie War Games, ​I highly recommend it. ​Excellent movie. ​I think it really ​properly gives you an idea of what hacking is like. ​It's also pretty fun movie. 
​But if you haven't seen it and you ​don't want to see it, that's okay. ​You'll still live your life just fine. ​Once I'm finished with passive reconnaissance, ​I'm going to move into active reconnaissance, ​which you can probably guess is gathering information by ​contacting the target. What'd that be? ​What we see in the picture is actually ​a port scan where I'm ​scanning to see what ports ​a target device is listening on. ​By finding that out, ​it's going to tell me some information about that target. ​It might tell me the operating systems, ​applications, application versions, device function. 
​For example, you can see in this picture in bold, ​they have port 80//tcp open. ​Well, that means this is either a web server or it's ​running some type of software that ​involves having a web server. ​That tells me something about ​the function of this computer. ​Then there are certain ports ​that certain operating systems will listen on as well. ​In fact, I can see in this list, ​few down from there, you can see MySQL is open. ​There's MySQL installed on this as well. ​Another thing, it might involve banner grabbing. 
​Banner grabbing is literally the grabbing of a banner. ​A banner is some type of information that ​the device gives out when somebody connects to it. ​Typically when they're talking about this, ​they mean in a command prompt. ​But this is probably ​the easy example to get a picture of. ​This is just a screenshot of ​a Linksys Wi-Fi router where you ​connect to the router and you're going to ​login to do it some administration. ​Well, it's telling me right here ​the exact model of router it is. ​Even if I don't get in as an administrator, ​now I know whoever this is using this model of router, ​I can go research that and say, okay, ​so that particular model or a router, ​what are some of the ways ​that people have penetrated that? 
​What are some of the vulnerabilities it has. ​That's where banner grabbing comes in. ​Ultimately, this result in footprinting, ​which is just gathering ​a valid picture of the targets environment. ​I map out. ​I start to get an idea ​of what their environment looks like, ​so I can pick out what it is exactly I'm going to attack. ​Don't be afraid to sit down with a paper and ​pencil and sketch a diagram. ​Great thing to have. 
​Once I'm done with my reconnaissance, ​I'm going to move into my initial exploitation, ​which is exactly what it sounds like. ​I'm going to use the information I got from ​reconnaissance to develop a plan to penetrate the target, ​and then I execute that plan. ​Sometimes they'll call this gaining access. ​Either way it's fine. We get in. ​Now, once we get in, it doesn't ​mean I got in as an administrator, ​just means I got in in some way. ​If I didn't get in as an administrator, ​my next step is going to be privileged escalation. 
​Escalation means to increase or make greater. ​If they didn't get in as an administrator, ​the attacker is going to seek to escalate ​their privileges to get administrative privileges. ​Why do we need administrative privileges? ​We need administrative privileges to ​be able to install malware that ​will allow the attacker to get ​back in at will without expending any effort. ​Presumably, if this target has good security, ​it took me a lot of work to get in. ​I don't have to do that every time ​I want to penetrate this target, ​so I'm going to leave behind some malware ​that's going to let me in. ​That process is called establishing persistence, ​meaning I can have a persistent connection to the target. 
​In this stage, the attacker install ​that malware that lets ​the attacker back in whenever they want. ​It typically involves installing a back door, ​which is a type of software that literally allows ​the attacker to bypass authentication controls. ​We'll see more about backdoors in ​some of the lessons on malware, ​that type of thing, it might ​involve installing a rootkit, ​modify the operating system to hide malware, ​so if I install this backdoor, ​I would prefer that nobody catches it and removes it, ​so maybe I'll install a root kit. ​But from a process standpoint, ​establishing persistence just means I installed ​something that lets me back ​in whenever I want to go back in. ​Then the last stage of ​real hacking would be clearing tract. ​The attacker wants to remove ​any indicators of compromise. ​That term just means something that would ​indicate to the target that they're compromised. 
​Anything that would alert them that there was ​a successful penetration I want to get rid of typically, ​it involves at least clearing ​any logs that contains suspicious events. ​I think the most interesting story ​I heard about this type of ​thing with indicators of compromise ​was from a student in Colorado. ​He said he had been involved with a company ​doing a security audit for another company. ​They noticed that all of the devices were patched. ​They were right up-to-date with patches, ​so they went to the company and said, ​you do a lovely job with ​patch management we just need to know how you do ​it so that we can document ​it for the audit and ​the company is like, patch management? ​We don't do any patch management. ​What was happening was somebody was ​breaking into their network on a routine basis, ​and then after they were done stealing what they want, ​they would patch the servers and nobody ​else could break in using the same technique, ​which I thought was sheer ​genius on the part of the attacker, ​but for that particular company, ​the fact that everything was patched was ​an indicator of compromise. 
​Then if you're an ethical hacker, ​you generally submit a report to the client, ​letting them know about ​any vulnerabilities that were exploited. ​Sometimes it might have advice ​for removing the vulnerabilities. ​But the ethical hacker's job is to figure ​out where the vulnerabilities are and exploit them. ​It's the client's job to fix them. ​Ethical hackers don't fix your network, ​they just tell you where the problems are. ​The last thing I want to talk about in ​this one is bug bounties. ​Remember, ethical hackers have permission. 
