        body {

        .fade-in {

            }
        }

            transform: translateY(-3px);
            box-shadow: 0 16px 28px -6px rgba(0, 0, 0, 0.35);
        }

        /* ── Encapsulation Panel ── */
        #encap-panel {
            width: 220px;
            flex-shrink: 0;
        }

        .encap-layer {
            position: relative;
            border-radius: 0.5rem;
            padding: 0.45rem 0.7rem;
            margin-bottom: 3px;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            opacity: 0.18;
            transition: opacity 0.35s ease, transform 0.35s ease, box-shadow 0.35s ease, background 0.35s ease;
            transform: translateX(8px);
            border-left: 3px solid transparent;
        }

        .encap-layer.active {
            opacity: 1;
            transform: translateX(0);
        }

        .encap-layer.active.just-added {
            box-shadow: 0 0 14px rgba(255, 255, 255, 0.12);
        }

        .encap-layer .pdu-badge {
            margin-left: auto;
            font-size: 0.55rem;
            padding: 1px 5px;
            border-radius: 4px;
            font-weight: 800;
            letter-spacing: 0.06em;
            opacity: 0.85;
        }

        .encap-arrow {
            text-align: center;
            font-size: 1.2rem;
            margin: 6px 0;
            transition: opacity 0.3s ease;
        }

        #encap-direction-label {
            font-size: 0.62rem;
            text-align: center;
            letter-spacing: 0.1em;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
            padding: 3px 6px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        /* Simulation Canvas Styles */
        :root {
            --accent-blue: #38bdf8;
        }

        .node {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .node.active {
            transform: scale(1.1);
            filter: drop-shadow(0 0 15px var(--accent-blue));
        }

        .connection-line {
            stroke: #334155;
            stroke-dasharray: 8;
            transition: stroke 0.5s;
        }

        .connection-line.active {
            stroke: var(--accent-blue);
            stroke-dasharray: 0;
            stroke-width: 3;
        }

        #packet {
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 0 8px var(--accent-blue));
        }

        .glass {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Handshake Flow */
        .handshake-step {
            position: relative;
            padding-left: 2rem;
        }

        .handshake-step::before {
            content: '';
            position: absolute;
            left: 0.5rem;
            top: 1.5rem;
            bottom: -0.5rem;
            width: 2px;
            background: #334155;
        }

        .handshake-step:last-child::before {
            display: none;
        }
    </style>

        function updateTerminal(msg, type = 'info') {

            p.className = colors[type] || 'text-slate-400';
            p.innerHTML = `<span class="text-slate-600 mr-2">${new Date().toLocaleTimeString([], { hour12: false, minute: '2-digit', second: '2-digit' })}</span> > ${msg}`;
            terminal.prepend(p);
        }

        function setNodeActive(nodeKey) {
            if (!nodes) return;
            Object.values(nodes).forEach(n => n && n.classList.remove('active'));
            if (nodes[nodeKey]) nodes[nodeKey].classList.add('active');
        }

        function startProcess() {
            const startBtn = document.getElementById('journey-start-btn');
            const nextBtn = document.getElementById('journey-next-btn');
            if (startBtn) startBtn.disabled = true;
            if (nextBtn) nextBtn.disabled = false;
            currentStepIndex = 0;
            updateJourneyUI();
        }

        function nextStep() {
            const steps = contentData.journey.steps;
            if (currentStepIndex < steps.length - 1) {
                currentStepIndex++;
                updateJourneyUI();
            } else {
                finishProcess();
            }
        }

        function prevStep() {
            if (currentStepIndex > 0) {
                currentStepIndex--;
                updateJourneyUI();
            }
        }

        function finishProcess() {
            const detailTitleEl = document.getElementById('journey-detail-title');
            const detailContentEl = document.getElementById('journey-detail-content');
            const nextBtn = document.getElementById('journey-next-btn');
            const prevBtn = document.getElementById('journey-prev-btn');
            const startBtn = document.getElementById('journey-start-btn');
            const counter = document.getElementById('journey-step-counter');

            if (detailTitleEl) detailTitleEl.innerText = "Connection Complete";
            if (detailContentEl) {
                detailContentEl.innerHTML = `
                    <p class="mb-3">The webpage is fully rendered. The <strong>TCP connection</strong> remains in a persistent keep-alive state for subsequent requests, eliminating repetitive handshakes.</p>
                    <p class="mb-3">When idle timeout is reached, the connection cleanly terminates via a standard <strong>4-way TCP FIN exchange</strong>.</p>
                    <div class="mt-4 p-3 bg-blue-950/40 border border-blue-500/30 rounded-xl text-blue-300 text-xs">
                        <strong>Complete Round Trip.</strong> Browser maintains parsed DOM, CSSOM, and local caches for maximum speed.
                    </div>
                `;
            }

            if (nextBtn) nextBtn.disabled = true;
            if (prevBtn) prevBtn.disabled = false;
            if (startBtn) {
                startBtn.disabled = false;
                startBtn.innerHTML = '<i data-lucide="refresh-cw" class="w-4 h-4"></i> Restart Request';
            }
            currentStepIndex = contentData.journey.steps.length;
            if (counter) counter.innerText = `Finished`;

            document.querySelectorAll('.step-item').forEach(el => el.classList.remove('active'));
            lucide.createIcons();
        }

        function updateJourneyUI() {

            const detailTitleEl = document.getElementById('journey-detail-title');
            const detailContentEl = document.getElementById('journey-detail-content');
            const counter = document.getElementById('journey-step-counter');
            const steps = contentData.journey.steps;

            packet = document.getElementById('packet');

            if (packet && (!nodes || !nodes.pc)) {

                nextBtn.innerHTML = currentStepIndex === steps.length - 1 ? 'Finish Process <i data-lucide="check" class="w-4 h-4"></i>' : 'Next Step <i data-lucide="chevron-right" class="w-4 h-4"></i>';
            }

            if (counter) counter.innerText = `${currentStepIndex + 1} / ${steps.length}`;

            const currentData = steps[currentStepIndex];
            if (currentData) {
                if (detailTitleEl) detailTitleEl.innerText = currentData.title;
                if (detailContentEl) {
                    detailContentEl.innerHTML = currentData.detail;
                    detailContentEl.scrollTop = 0;

            }

            updateEncapsulation(currentStepIndex);

            if (packet && paths) {
                Object.values(paths).forEach(p => p && p.classList.remove('active'));

                        setNodeActive('dns');
                        packet.setAttribute('cx', 400);
                        packet.setAttribute('cy', 100);
                        setTimeout(() => {

                            updateTerminal("DNS Found: 142.250.190.46 (A Record)", 'success');
                            packet.setAttribute('cx', 150);
                            packet.setAttribute('cy', 200);
                            setNodeActive('pc');

                        setNodeActive('router');
                        packet.setAttribute('cx', 350);
                        packet.setAttribute('cy', 250);
                        setTimeout(() => {
                            if (currentStepIndex !== 2) return;
                            updateTerminal("ARP Reply received: Gateway MAC 00:1A:2B:3C:4D:5E", 'success');
                            packet.setAttribute('cx', 150);
                            packet.setAttribute('cy', 200);
                            setNodeActive('pc');
                        }, 800);

                    case 3:
                        if (stepToastEl) stepToastEl.innerText = "STATUS: TCP & TLS HANDSHAKE";
                        updateTerminal("Initiating TCP 3-Way Handshake (SYN → SYN-ACK → ACK)...");
                        if (paths.routerServer) paths.routerServer.classList.add('active');
                        packet.setAttribute('cx', 650);
                        packet.setAttribute('cy', 200);
                        setNodeActive('server');
                        setTimeout(() => {
                            if (currentStepIndex !== 3) return;
                            updateTerminal("TCP Connection established. TLS 1.3 keys derived.", 'success');
                            packet.setAttribute('cx', 150);
                            packet.setAttribute('cy', 200);
                            setNodeActive('pc');
                        }, 800);
                        break;
                    case 4:

                        updateTerminal("Building HTTP Request, adding TCP, IP, and Ethernet headers...");
                        setNodeActive('pc');
                        packet.setAttribute('cx', 150);
                        packet.setAttribute('cy', 200);
                        break;
                    case 5:

                        updateTerminal("Frame traversing autonomous systems via BGP...");
                        setNodeActive('router');
                        packet.setAttribute('cx', 350);
                        packet.setAttribute('cy', 250);
                        setTimeout(() => {
                            if (currentStepIndex !== 5) return;
                            updateTerminal("Packet arrived at Google edge. Stripping headers and parsing HTTP.");
                            packet.setAttribute('cx', 650);
                            packet.setAttribute('cy', 200);
                            setNodeActive('server');
                        }, 800);
                        break;
                    case 6:
                        if (stepToastEl) stepToastEl.innerText = "STATUS: RESPONSE ENCAPSULATION";
                        updateTerminal("Server generating HTTP 200 OK HTML response...");
                        setNodeActive('server');
                        packet.setAttribute('cx', 650);
                        packet.setAttribute('cy', 200);
                        break;
                    case 7:

                        updateTerminal("Response arriving at local network NAT gateway...");
                        packet.style.fill = "#10b981";
                        setNodeActive('router');
                        packet.setAttribute('cx', 350);
                        packet.setAttribute('cy', 250);
                        setTimeout(() => {

                            updateTerminal("Stripping Ethernet + IP + TCP headers. Decrypting TLS...");
                            packet.setAttribute('cx', 150);
                            packet.setAttribute('cy', 200);

                        break;

                        packet.setAttribute('cx', 150);
                        packet.setAttribute('cy', 200);

                `;

                cat.commands.forEach(item => {
                    const cleanCmd = item.cmd.replace(/'/g, "\\'");
                    html += `
                        <div class="cheatsheet-item group">
                            <div class="bg-slate-950 text-emerald-400 font-mono text-xs p-2.5 rounded-xl border border-slate-800 flex items-center justify-between group-hover:border-slate-700 transition-colors">
                                <div class="overflow-x-auto no-scrollbar whitespace-nowrap mr-2">
                                    <span class="text-slate-600 select-none">$ </span><span>${item.cmd}</span>
                                </div>
                                <button onclick="copySnippet('${cleanCmd}')" title="Copy command" class="text-slate-500 hover:text-slate-200 p-1 rounded hover:bg-slate-800 transition-colors shrink-0">
                                    <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                                </button>
                            </div>
                            <p class="text-xs text-slate-400 pl-1 mt-1.5 leading-relaxed">${item.desc}</p>
                        </div>
                    `;
                });

                html += '</div></div></div>';
            });

            html += '</div></div>';
            return html;
        }

        function initCheatsheetSearch() {
            const input = document.getElementById('cheatsheet-search');
            if (input) {
                input.oninput = () => {
                    const q = input.value.toLowerCase().trim();
                    const cards = document.querySelectorAll('.cheatsheet-category-card');

                    cards.forEach(card => {
                        let hasMatch = false;
                        const items = card.querySelectorAll('.cheatsheet-item');
                        items.forEach(item => {
                            const text = item.textContent.toLowerCase();
                            if (text.includes(q)) {
                                item.style.display = '';
                                hasMatch = true;
                            } else {
                                item.style.display = 'none';
                            }
                        });
                        card.style.display = hasMatch ? '' : 'none';
                    });
                };
            }
        }

        renderTabs();
        renderContent();
    </script>

    <script src="../assets/script.js"></script>
</body>

</html>
